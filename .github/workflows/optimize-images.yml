name: Optimize site images to WebP
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-images.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python scripts/optimize_images.py
      - name: Validate image references and checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text()
          assert "https://pay.hotmart.com/Q108388189Y?checkoutMode=10" in s
          assert "1230711868163260" in s
          assert all(Path(x).exists() for x in set(re.findall(r'assets/[A-Za-z0-9_.-]+\.(?:png|webp|jpg)',s)))
          print("Validation passed")
          PY
      - name: Commit optimized assets and updated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets
          if ! git diff --cached --quiet; then
            git commit -m "Optimize visual assets to WebP without layout changes"
            git push
          fi
